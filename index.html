    document.querySelectorAll('.hotspot').forEach(h => {
      const rh = document.createElement('div');
      rh.className = 'resize-handle';
      h.appendChild(rh);

      let hotDragged = false;
      h.addEventListener('click', e => { if (hotDragged) { e.stopImmediatePropagation(); hotDragged = false; } }, true);

      h.addEventListener('mousedown', function(e) {
        if (e.target === rh) return;
        const imgEl = h.closest('.screen').querySelector('img.bg');
        const startX = e.clientX, startY = e.clientY;
        const startL = parseFloat(h.style.left), startT = parseFloat(h.style.top);
        let ir = imgEl.getBoundingClientRect();
        hotDragged = false;
        function onMove(e) {
          const dx = e.clientX - startX, dy = e.clientY - startY;
          if (Math.sqrt(dx*dx + dy*dy) < 5) return;
          hotDragged = true;
          if (!ir.width) ir = imgEl.getBoundingClientRect();
          h.style.left = (startL + dx / ir.width  * 100).toFixed(1) + '%';
          h.style.top  = (startT + dy / ir.height * 100).toFixed(1) + '%';
          updatePanel();
        }
        function onUp() { document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); }
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      });

      rh.addEventListener('mousedown', function(e) {
        e.preventDefault(); e.stopPropagation();
